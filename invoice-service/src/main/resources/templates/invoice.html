<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoice</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333;
            line-height: 1.4;
            font-size: 14px;
            margin: 0;
            padding: 0;
        }
        .invoice-header {
            margin-bottom: 30px;
            border-bottom: 2px solid #f4f4f4;
            padding-bottom: 20px;
        }
        .shop-name {
            font-size: 28px;
            font-weight: bold;
            color: #1a73e8;
            margin: 0 0 5px 0;
        }
        .invoice-title {
            font-size: 20px;
            text-transform: uppercase;
            color: #555;
            margin: 0;
            text-align: right;
            float: right;
        }
        .clear {
            clear: both;
        }
        .details-container {
            margin-bottom: 30px;
        }
        .details-col {
            width: 48%;
            float: left;
        }
        .details-col.right {
            float: right;
            text-align: right;
        }
        .details-label {
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .details-value {
            font-weight: bold;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: bold;
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #dee2e6;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
        .total-section {
            float: right;
            width: 40%;
            margin-top: 10px;
        }
        .total-row {
            font-size: 16px;
            font-weight: bold;
            background-color: #f8f9fa;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
        }
        .footer {
            margin-top: 60px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="invoice-header">
        <h1 class="invoice-title">Invoice</h1>
        <p class="shop-name" th:text="${shopName}">Shop Name</p>
        <div class="clear"></div>
    </div>

    <!-- Metadata Details -->
    <div class="details-container">
        <div class="details-col">
            <div class="details-label">Billed To:</div>
            <div class="details-value" th:text="${customerName}">Customer Name</div>
            <div class="details-label">Contact Number:</div>
            <div class="details-value" th:text="${customerNumber}">+1 234 567 890</div>
        </div>
        <div class="details-col right">
            <div class="details-label">Order ID:</div>
            <div class="details-value" th:text="${orderId}">#10001</div>
            <div class="details-label">Date:</div>
            <!-- Formats current server date if no specific date variable is passed -->
            <div class="details-value" th:text="${#calendars.format(#calendars.createNow(), 'dd MMM yyyy')}">25 Jun 2026</div>
        </div>
        <div class="clear"></div>
    </div>

    <!-- Items Table -->
    <table>
        <thead>
            <tr>
                <th>Item Description</th>
                <th class="text-center" style="width: 10%;">Qty</th>
<!--                <th class="text-right" style="width: 20%;">Price</th>-->
                <th class="text-right" style="width: 20%;">Total</th>
            </tr>
        </thead>
        <tbody>
            <!-- Loops through the 'items' collection -->
            <tr th:each="item : ${items}">
                <td th:text="${item.description}">Item Name</td>
                <td class="text-center" th:text="${item.quantity}">1</td>
<!--                <td class="text-right" th:text="${item.price}">$0.00</td>-->
                <td class="text-right" th:text="${item.totalPrice}">$0.00</td>
            </tr>
        </tbody>
    </table>

    <!-- Total Amount Section -->
    <div class="total-section">
        <div class="total-row">
            <span style="float: left;">Grand Total:</span>
            <span style="float: right;" th:text="${totalAmount}">$0.00</span>
            <div class="clear"></div>
        </div>
    </div>
    <div class="clear"></div>

    <!-- Footer -->
    <div class="footer">
        <p>Thank you for your business!</p>
    </div>

</body>
</html>
