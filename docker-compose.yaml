services:
  mysqldb:
    image: mysql:8.3.0
    container_name: invoice_app_mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: invoice_app_user_auth_db
      MYSQL_USER: invoiceApp
      MYSQL_PASSWORD: invoiceApp
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql